- name: Uniphore Identity (OpenID Connect)
  description: 'Uniphore''s dedicated Auth0 identity tenant, which fronts sign-in for
    the Uniphore customer portal and issues the OAuth 2.0 / OIDC tokens used against
    Uniphore services. It publishes anonymous OIDC discovery and RFC 8414
    authorization-server metadata, supports authorization code with PKCE (S256),
    client credentials, refresh token, device code, token exchange and JWT bearer
    grants, plus DPoP, CIBA and back-channel logout.'
  humanURL: https://uniphore.us.auth0.com/.well-known/openid-configuration
  baseURL: https://uniphore.us.auth0.com
  tags:
  - Authentication
  - Authorization
  - Identity
  - OpenID Connect
  properties:
  - type: OpenIDConnect
    url: well-known/uniphore-openid-configuration.json
  - type: Authentication
    url: authentication/uniphore-authentication.yml
  - type: OAuthScopes
    url: scopes/uniphore-scopes.yml
- name: Uniphore U-Capture REST APIs
  description: 'The U-Capture compliance conversation-recording platform (Red Box heritage)
    publishes an anonymous, unauthenticated API reference on Uniphore''s own documentation
    portal at support-rb.uniphore.com — fifteen REST API families covering media retrieval and
    live audio, metadata/annotation/transcription/lock, call suppression, record on demand,
    export and transcription endpoints, audit, diagnostics, health-monitoring alerts, usage
    metrics, identity and roles, LDAP mapping, licensing, policy and services configuration.
    Every API sits behind an API Gateway that handles authentication, throttling, routing and
    versioning. The reference is feature-and-function level: each API publishes an "API Summary"
    naming every HTTP request, but paths, verbs, parameters, schemas, status codes and examples
    are described as being "provided within the APIs" — that is, in the running deployment — so
    no machine-readable contract is published. U-Capture is customer-deployed and Uniphore
    publishes no base URL; the entitled API set differs across the Enterprise, Connect and
    Capture editions.'
  humanURL: https://support-rb.uniphore.com/conversa/DevelopConversa/DevelopUCaptureV2.0/DevelopUCapture/DevelopUCapture.htm
