aid: uniphore
name: Uniphore
description: 'Uniphore is an enterprise AI company — "The Business AI Company" — founded
  in 2008 and headquartered in Palo Alto, California. Its flagship platform, the Business
  AI Cloud (BAIC), is a sovereign, composable and secure AI platform organised into
  four layers: a Data Layer for zero-copy access to enterprise data, a Knowledge Layer
  for retrieval and grounding, a Model Layer for serving and fine-tuning small and
  large language models without vendor lock-in, and an Agentic Layer for no-code,
  BPMN-based agent orchestration. Products span Marketing AI (CDP Agent), Sales AI,
  People AI and Customer Service AI (real-time guidance, self-service, conversation
  insights and communication recording agents). The platform ships as a managed
  multi-region cloud service and as a customer-deployed Kubernetes/Helm distribution
  of 13 microservices with a documented machine-to-machine token exchange, a /v1
  question-answering API and an OpenAI-compatible LLM inference proxy. Uniphore
  serves 2,000+ enterprises, raised a $260M Series F from NVIDIA, AMD, Snowflake and
  Databricks, and has acquired Orby AI, Autonom8, ActionIQ, Infosum and Jacada. Its one
  anonymous API reference sits apart from uniphore.com, on the U-Capture documentation
  portal at support-rb.uniphore.com, which documents fifteen REST API families plus a
  webhook/SNMP health-alert surface without publishing a machine-readable contract.'
