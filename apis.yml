apis:
- name: Uniphore Business AI Cloud (BAIC) Platform API
  description: 'The Business AI Cloud platform API. The publicly documented surface
    is the customer-deployed BAIC distribution: a machine-to-machine token exchange
    at POST /auth/m2m-token, a retrieval-augmented question-answering endpoint at
    POST /v1/question-answer/ask, an OpenAI-compatible LLM inference proxy at
    /openai/v1, and a small-language-model fine-tuning studio at /v1, fronted by
    forge-api-gateway. Uniphore publishes no OpenAPI definition and no public API
    reference; api.uniphore.com is a live Kong gateway whose routes are tenant- and
    product-scoped. For self-hosted deployments the base URL is customer-determined.'
  humanURL: https://uniphore.github.io/baic-docs/
  baseURL: https://api.uniphore.com
  tags:
  - Artificial Intelligence
  - Agents
  - Large Language Models
  - Knowledge-Management
  tags_raw:
