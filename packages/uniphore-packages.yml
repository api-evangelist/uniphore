note: >-
  Uniphore publishes no general-purpose, versioned server SDK for a public REST
  API. What it does publish first-party are Node client libraries and chat UI
  libraries on npm, authored by "Uniphore" and pointing at repositories in the
  github.com/uniphore organization. These are solution-delivery libraries for
  the Interact conversation surface and for contact-centre messaging
  integrations (Five9, Ameyo). They are real and first-party, but most were last
  published in 2023-2024. Registries probed with no first-party result: PyPI,
  Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist, crates.io.
