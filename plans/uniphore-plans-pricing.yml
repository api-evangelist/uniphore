  note: >-
    No API metering, per-call price, credit pack or usage quota is published for the
    Business AI Cloud platform API or for the U-Capture REST APIs. U-Capture does ship a
    Usage Metrics API that reports both captured-call volume and consumed-API volume on a
    configurable schedule, which is the instrumentation a commercial meter would sit on
    top of — but no rate card is attached to it in public documentation.
licensing:
  note: >-
    U-Capture is licence-keyed rather than plan-tiered: the U-Capture Licence API applies,
    updates, verifies and reports usage against licences held by a U-Capture Tenant, and
    the docs distinguish three product editions — U-Capture Enterprise (all APIs),
    U-Capture Connect and U-Capture Capture (reduced API set by default) — with the
    entitlement set defined in the customer's Solution Design Document or Product
    Specification, not on the public web.
