quota_visibility:
  usage_metrics_api: >-
    U-Capture ships a Usage Metrics API whose reports can cover the Output (APIs) side of the
    system — reportType ConsumedApis — on a Daily / Weekly / Monthly / Yearly schedule. That is
    after-the-fact consumption reporting delivered to a configured endpoint, not a runtime
    rate-limit signal an agent can react to.
