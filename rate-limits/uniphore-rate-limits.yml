name: Uniphore Rate Limits
limit_count: 0
summary: >-
  Uniphore documents that rate limiting EXISTS as an API gateway capability but publishes no
  numbers, no windows, no response headers and no exhaustion status code. The U-Capture API
  Gateway topic states that the gateway manages "performance related capabilities such as
  throttling (or rate limiting), request aggregation, routing, load balancing, and caching
  between backend services" — a capability statement, not a contract. On the Business AI Cloud
  side, api.uniphore.com is a Kong gateway that answers every unrouted anonymous request with
  {"message":"no Route matched with those values"} and returns no RateLimit-* or X-RateLimit-*
  headers, so nothing could be observed live either. limit_count is 0 because zero numeric
  limits are published — an honest zero, not an unchecked field.
http_rate_limits: []
mechanism:
  documented: true
  enforced_at: API gateway (Kong on api.uniphore.com; the U-Capture API Gateway reverse proxy
    on customer-deployed U-Capture)
  configurable_per_deployment: true
  note: >-
    Because U-Capture and the BAIC distribution are customer-deployed behind a customer- or
    Uniphore-operated gateway, any effective limit is a deployment setting rather than a
    published product contract. A prospective integrator cannot learn their limit from the
    public documentation.
