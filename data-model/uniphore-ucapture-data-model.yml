stores:
  named_in_docs: [Media Store, Metadata Store, Event Store, Audit Store]
  note: >-
    Named in the Health Monitoring "Get Storage Details" request, whose capacity figures are
    parsed from the most recent File System Size Alert (statusCode 1002) rather than read live.
    External storage locations configured via the Services Configuration API are excluded from
    those capacity figures.
gaps:
  field_reference: >-
    A "Metadata Reference" topic exists in the docs set and is described as a reference list of
    all U-Capture metadata fields; field names and types are not reproduced here because they
    were not harvested field-by-field in this pass.
  identifiers: No id prefix scheme, format or example value is published for Call ID or Segment ID.
  schemas: No JSON Schema, OpenAPI components or payload example is published for any entity.
