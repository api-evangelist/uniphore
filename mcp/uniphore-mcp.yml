acronym_collision:
  finding: >-
    Uniphore's marketing uses "MCP" to mean something else. The Agentic Layer page reads: "Work
    seamlessly with external agents and tools using Uniphore's Multi-Agent Collaboration Protocol
    (MCP)." That is Uniphore's own multi-agent orchestration concept, not Anthropic's Model
    Context Protocol, and it is neither specified nor documented publicly. Secondary coverage
    that describes Uniphore as "MCP-based" is repeating this collision. Do not score, index or
    link Uniphore as shipping a Model Context Protocol server on the strength of that sentence.
  quote: Work seamlessly with external agents and tools using Uniphore's Multi-Agent Collaboration
