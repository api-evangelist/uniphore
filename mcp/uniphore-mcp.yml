summary: >-
  Uniphore publishes no Model Context Protocol server — no hosted endpoint, no stdio package, no
  registry listing, and no MCP documentation. Searches of the docs, the github.com/uniphore
  organisation (3 public repos, none MCP-related), npm and the public MCP registries returned
